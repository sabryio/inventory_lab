[project]
name = "inventory-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sabry Awad", email = "dr.sabry1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
inventory-lab = "inventory_lab:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]
